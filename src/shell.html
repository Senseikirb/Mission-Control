<style>

split{display:flex;align-items:center;justify-content:space-between;gap:14px}.stack{display:flex;flex-direction:column;gap:12px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{display:inline-flex;padding:3px 8px;border:1px solid var(--line);border-radius:4px;font:.75rem/1.5 var(--mono);color:var(--muted)}.chip.core{border-color:#397985;color:var(--cyan)}.chip.stretch{color:var(--gold)}.track{color:var(--track,var(--cyan));border-color:var(--track,var(--cyan));opacity:.92}.track-checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 10px}.track-checks label{font-size:.83rem}.budget{margin-top:14px;padding:14px;background:#0c1728;border-radius:7px}.bar{height:6px;background:#283950;border-radius:8px;overflow:hidden;margin:9px 0}.bar>span{display:block;background:var(--cyan);height:100%;max-width:100%}.statrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0}.stat{border-left:2px solid var(--line);padding-left:13px}.stat strong{display:block;font:600 1.55rem var(--mono);color:var(--text)}.stat span{font-size:.8rem;color:var(--muted)}.suggestion{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:15px;border:1px solid var(--line);border-radius:10px;padding:20px;background:#101c30;margin:12px 0}.suggestion:first-child{border-color:#477984}.index{font:1.15rem var(--mono);color:var(--cyan);padding-top:3px}.suggestion h3{margin-bottom:8px}.suggestion .actions{display:flex;flex-direction:column;gap:8px;min-width:142px;align-self:center}.why{font-size:.85rem;color:var(--muted);margin:10px 0}.note{padding:12px 15px;background:#0a1525;border-left:2px solid var(--gold);font-size:.87rem;color:var(--muted);border-radius:4px;margin:12px 0}.notice{padding:16px;border:1px solid #8e7250;background:#312920;border-radius:8px;margin-bottom:20px;overflow-wrap:anywhere}.notice button{margin:8px 8px 0 0}.notice.error{background:#321f2c;border-color:#a26279}.entry{border-top:1px solid var(--line);padding:16px 0;min-width:0}.entry:
